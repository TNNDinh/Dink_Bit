services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: debtbook
      POSTGRES_PASSWORD: debtbook_local
      POSTGRES_DB: debtbook
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debtbook"]
      interval: 5s
      retries: 10
  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: debtbook
      MINIO_ROOT_PASSWORD: debtbook_local_storage
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["storage_data:/data"]
volumes:
  postgres_data:
  storage_data:
